[package]
name = "lz-copyback"
version = "3.1.0"
authors = ["Andrea Cracco <guilucand@gmail.com>"]
edition = "2024"
rust-version = "1.85"
readme = "README.md"
keywords = ["compression", "lz77", "decompression", "xz", "zstd"]
categories = ["compression"]
description = "xz, zstd, lz4 and gzip decoders that decode in place and report the LZ matches they decode"
license = "MIT OR Apache-2.0"
repository = "https://github.com/algbio/ggcat"

[lib]
name = "lz_copyback"
doctest = false

[dependencies]
# Patched C libraries, vendored under external/ (see their PATCH.md).
lzcb-lzma-sys = { path = "external/lzma-sys", version = "0.3.1" }
lzcb-zstd-sys = { path = "external/zstd-sys", version = "0.3.1", default-features = false }
lzcb-lz4-sys = { path = "external/lz4-sys", version = "0.1.2" }
# Already has the match hook (`DeflateOutput::on_lz_copy`).
streaming-libdeflate-rs = "0.3.1"
# The gzip member checksum, computed by the in-place decoder on its own output.
crc32fast = "1.4"

[dev-dependencies]
rand = "0.8.5"
# Stock encoders and decoders, to produce the test data and to compare against. Every test
# binary links them next to the prefixed forks, which is the coexistence check: if a C
# symbol lost its prefix, the link fails.
flate2 = "1.1"
liblzma = { version = "0.4.9", features = ["static", "parallel"] }
zstd = "0.13.3"
lz4 = "1.28.1"

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "stress"
harness = false

[workspace]
members = [".", "external/lzma-sys", "external/zstd-sys", "external/lz4-sys"]

[profile.release]
opt-level = 3
codegen-units = 16
debug = false
lto = "off"
