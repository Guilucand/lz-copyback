# Vendored copy of lz4_flex 0.11.6 with the ggcat LZ match hook (see PATCH.md).

[package]
edition = "2021"
rust-version = "1.81"
name = "lzcb-lz4-flex"
version = "0.1.0+lz4flex.0.11.6"
authors = [
    "Pascal Seitz <pascal.seitz@gmail.com>",
    "Arthur Silva <arthurprs@gmail.com>",
    "ticki <Ticki@users.noreply.github.com>",
]
build = false
include = [
    "src/*.rs",
    "src/frame/**/*",
    "src/block/**/*",
    "README.md",
    "LICENSE",
    "PATCH.md",
    "ggcat-lz-hook.patch",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fork of lz4_flex 0.11.6 whose block and frame decoders report every LZ match through a hook, for the lz-copyback crate."
homepage = "https://github.com/pseitz/lz4_flex"
readme = "README.md"
keywords = [
    "compression",
    "lz4",
    "compress",
    "decompression",
    "decompress",
]
license = "MIT"
repository = "https://github.com/algbio/ggcat"
# upstream: "https://github.com/pseitz/lz4_flex"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
checked-decode = []
default = [
    "std",
    "safe-encode",
    "safe-decode",
    "frame",
    "checked-decode",
]
frame = [
    "std",
    "dep:twox-hash",
]
nightly = []
safe-decode = []
safe-encode = []
std = []

[lib]
name = "lzcb_lz4_flex"
path = "src/lib.rs"
# Upstream's doc examples say `use lz4_flex::...` and one of them needs serde_json; the
# lib is `lzcb_lz4_flex` here, so rewriting them all would only add divergence.
doctest = false

[dependencies.twox-hash]
version = "2.0.0"
features = ["xxhash32"]
optional = true
default-features = false

# Only what upstream's inline #[cfg(test)] modules need. The six other dev-dependencies
# (lzzzz, binggan, jemallocator, lz4-compress, serde_json, snap) served the tests/ and
# benches/ directories, which this fork does not carry.
[dev-dependencies.proptest]
version = "1.0.0"

[dev-dependencies.more-asserts]
version = "0.3.1"
