# Vendored copy of liblzma-sys 0.4.7 with the ggcat LZ match hook (see PATCH.md).

[package]
edition = "2021"
rust-version = "1.60"
name = "lzcb-lzma-sys"
version = "0.1.0+xz.5.8.3"
authors = [
    "Alex Crichton <alex@alexcrichton.com>",
    "Portable-Network-Archive Developers",
]
build = "build.rs"
links = "lzcb_lzma"
exclude = [
    "xz/.github/",
    "xz/tests/files/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fork of liblzma-sys 0.4.7 (XZ Utils 5.8.3) whose LZ decoder reports every match through a hook and whose C symbols are prefixed, for the lz-copyback crate."
homepage = "https://github.com/portable-network-archive/liblzma-rs"
readme = "README.md"
keywords = [
    "lzma",
    "xz",
    "encoding",
    "wasm",
]
categories = ["external-ffi-bindings"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/algbio/ggcat"
# upstream: "https://github.com/portable-network-archive/liblzma-rs"

[features]
default = []
fat-lto = []
thin-lto = []

[lib]
name = "lzcb_lzma_sys"
path = "src/lib.rs"

[dependencies.libc]
version = "0.2.67"

[build-dependencies.cc]
version = "1.0.49"
features = ["parallel"]

[[test]]
name = "symbols"
path = "tests/symbols.rs"

[dev-dependencies.object]
version = "0.37"
